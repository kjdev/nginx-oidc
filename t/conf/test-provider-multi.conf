oidc_session_store memory_multi_store {
    type memory;
    size 10m;
    ttl 3600;
}

# Two providers with distinct issuer strings that both reach the same stub IdP
# (127.0.0.1:8888 and 127.0.0.2:8888 - both loopback addresses served by the
# stub listening on 0.0.0.0:8888). Distinct issuers produce two separate nodes
# in the metadata shared-memory rbtree, which exercises the second (and later)
# ngx_rbtree_insert() path through the custom insert callback.
#
# Both issuers use literal loopback IPs rather than a hostname so that the
# metadata fetch (proxy_pass with a variable) never needs DNS resolution. A
# hostname would be resolved at runtime via the `resolver` directive, which is
# environment-specific (e.g. systemd-resolved at 127.0.0.53 is absent inside
# the Alpine CI container) and would make the fetch time out.
oidc_provider multi_provider_a {
    issuer "http://127.0.0.1:8888";
    client_id "test";
    client_secret "b028e7a42bbb072acf09ed342e760627";
    redirect_uri "http://127.0.0.1:1984/oidc_callback";
    session_store memory_multi_store;
    userinfo on;
}

oidc_provider multi_provider_b {
    issuer "http://127.0.0.2:8888";
    client_id "test";
    client_secret "b028e7a42bbb072acf09ed342e760627";
    redirect_uri "http://127.0.0.1:1984/oidc_callback";
    session_store memory_multi_store;
    userinfo on;
}
