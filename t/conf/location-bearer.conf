
location / {
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
    proxy_set_header X-Id-Token $oidc_id_token;
    proxy_set_header X-Access-Token $oidc_access_token;
    proxy_set_header X-UserInfo $oidc_userinfo;
    proxy_set_header X-User-ID $oidc_claim_sub;
}

location = /bearer {
    auth_oidc_bearer on;
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
    proxy_set_header X-Id-Token $oidc_id_token;
    proxy_set_header X-Access-Token $oidc_access_token;
    proxy_set_header X-UserInfo $oidc_userinfo;
    proxy_set_header X-User-ID $oidc_claim_sub;
}

location = /bearer-verify {
    auth_oidc_bearer on;
    auth_oidc_mode verify;
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
    proxy_set_header X-Id-Token $oidc_id_token;
    proxy_set_header X-Access-Token $oidc_access_token;
    proxy_set_header X-UserInfo $oidc_userinfo;
    proxy_set_header X-User-ID $oidc_claim_sub;
}

location = /bearer-aud-other {
    auth_oidc_bearer on;
    auth_oidc_bearer_audience "other-api";
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
    proxy_set_header X-User-ID $oidc_claim_sub;
}

location = /bearer-aud-test {
    auth_oidc_bearer on;
    auth_oidc_bearer_audience "test";
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
    proxy_set_header X-User-ID $oidc_claim_sub;
}

location = /no-bearer {
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
}

location = /no-bearer-verify {
    auth_oidc_mode verify;
    proxy_pass http://app;
    proxy_set_header X-Authenticated $oidc_authenticated;
}

location = /bearer-helper {
    auth_oidc off;
    content_by_lua_block {
        local http = require "resty.http"
        local oidc_test = require "oidc_test"
        local dict = ngx.shared.cookie_dict

        local args = ngx.req.get_uri_args()
        local path = args.path or "/bearer"
        local auth = args.auth or "none"
        local use_cookie = args.cookie == "valid"

        local httpc = http.new()

        local function ensure_valid()
            local token = dict:get("bearer_token")
            local cookie = dict:get("bearer_cookie")
            if token and cookie then
                return token, cookie
            end

            local res = oidc_test.full_flow(httpc)
            if not res then
                ngx.log(ngx.ERR, "bearer-helper: full_flow failed")
                return nil, nil
            end

            local id_token = string.match(res.body, "id%-token:([^\n]+)")
            local set_cookie = res.headers["Set-Cookie"]

            dict:set("bearer_token", id_token)
            dict:set("bearer_cookie", set_cookie)

            return id_token, set_cookie
        end

        local headers = {}

        if auth == "valid" then
            local token = ensure_valid()
            headers["Authorization"] = "Bearer " .. token
        elseif auth == "invalid" then
            headers["Authorization"] = "Bearer not-a-jwt"
        elseif auth == "bad-signature" then
            headers["Authorization"] =
                "Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9" ..
                ".eyJzdWIiOiJ0ZXN0In0.invalidsignaturevalue"
        elseif auth == "empty" then
            headers["Authorization"] = "Bearer" .. string.rep(" ", 1)
        elseif auth == "empty-space" then
            headers["Authorization"] = "Bearer" .. " \t "
        elseif auth == "no-separator" then
            headers["Authorization"] = "Bearer"
        elseif auth == "malformed" then
            headers["Authorization"] = "BearerAbc xyz"
        elseif auth == "basic" then
            headers["Authorization"] = "Basic dGVzdDp0ZXN0"
        end
        -- auth == "none": no Authorization header sent

        if use_cookie then
            local _, cookie = ensure_valid()
            headers["Cookie"] = cookie
        end

        local res, err = httpc:request_uri("http://127.0.0.1:1984" .. path, {
            follow_redirects = false,
            headers = headers,
        })
        if not res then
            ngx.log(ngx.ERR, "bearer-helper: request failed: ", err)
            return
        end

        ngx.status = res.status

        local forward_headers = { "WWW-Authenticate", "Location" }
        for _, h in ipairs(forward_headers) do
            local val = res.headers[h]
            if val then
                ngx.header[h] = val
            end
        end

        ngx.print(res.body)
    }
}
