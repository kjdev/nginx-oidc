# Memory store with a deliberately small max entry count so that the store
# reaches capacity after a handful of completed logins. This exercises the
# eviction path on every subsequent authentication: the transient pre-auth
# entries (state/nonce/code_verifier, ~600s TTL) must survive eviction even
# though their expiration is far earlier than the long-lived session entries
# (id_token/access_token/userinfo, `ttl` seconds). LRU eviction keeps the
# freshly created, in-flight pre-auth entries; the previous expiration-ordered
# eviction dropped them and broke the callback with a 401.
oidc_session_store memory_evict_store {
    type memory;
    size 10m;
    ttl 3600;
    memory_max_size 32;
}

oidc_provider test_provider {
    issuer "http://127.0.0.1:8888";
    client_id "test";
    client_secret "b028e7a42bbb072acf09ed342e760627";
    redirect_uri "http://127.0.0.1:1984/oidc_callback";
    session_store memory_evict_store;
    userinfo on;
}
