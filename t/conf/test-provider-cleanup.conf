# Provider without an explicit session_store, so pre-auth entries, the
# periodic cleanup (cleanup_expired with a NULL store) and the /status report
# all operate on the same default shared memory zone. pre_auth_timeout is set
# to 1 second so state/nonce/code_verifier/orig_uri expire quickly and a single
# cleanup can be observed via /status.
oidc_provider test_provider {
    issuer "http://127.0.0.1:8888";
    client_id "test";
    client_secret "b028e7a42bbb072acf09ed342e760627";
    redirect_uri "http://127.0.0.1:1984/oidc_callback";
    pre_auth_timeout 1;
}
